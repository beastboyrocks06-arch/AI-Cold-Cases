name: YouTube Uploader (09:00 IST)

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify repository files
        run: |
          echo "Repository:"
          git remote -v

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

          echo "Scripts directory:"
          ls -la scripts/

          echo "Checking uploader:"
          test -f scripts/youtube_uploader.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload videos to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python -u scripts/youtube_uploader.py

      - name: Commit upload status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update YouTube upload status"
            git push
          else
            echo "No upload status changes."
          fi
